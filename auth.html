<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.title">Authorization Required</title>
    <link rel="stylesheet" href="terminal.css">
    <style>
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 3;
        }

        .auth-form {
            background: color-mix(in srgb, var(--foreground) 5%, transparent);
            border: 1px solid color-mix(in srgb, var(--foreground) 25%, transparent);
            border-radius: var(--radius);
            padding: 30px;
            margin: 30px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: color-mix(in srgb, var(--background) 95%, transparent);
            border: 1px solid color-mix(in srgb, var(--foreground) 30%, transparent);
            color: var(--foreground);
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 5px var(--accent);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            box-shadow: 0 0 10px var(--accent);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-message {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: color-mix(in srgb, var(--foreground) 60%, transparent);
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: color-mix(in srgb, var(--foreground) 70%, transparent);
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link a:hover {
            color: var(--accent);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body class="crt">
<!-- Элементы CRT-эффектов -->
<div class="scanline"></div>
<div class="crt-vignette"></div>
<div class="crt-curvature"></div>

<div class="container">
    <header>
        <div class="auth-header">
            <h1 class="crt-text" data-i18n="auth.title">ТЕРМИНАЛ АВТОРИЗАЦИИ</h1>
            <p class="crt-text" data-i18n="auth.subtitle">Доступ к защищенному сектору</p>
        </div>
    </header>

    <section class="content">
        <div class="loading" id="loading">
            <span data-i18n="auth.loading">Инициализация системы безопасности...</span>
        </div>

        <div class="auth-form" id="authForm" style="display: none;">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" data-i18n="auth.username">Имя пользователя:</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="auth.password">Пароль:</label>
                    <input type="password" id="password" name="password" required autocomplete="off">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn" data-i18n="auth.login">ВХОД В СИСТЕМУ</button>

                <div id="errorMessage" class="error-message" data-i18n="auth.error">
                    Неверные учетные данные. Попробуйте снова.
                </div>
            </form>
        </div>

        <div class="auth-message">
            <p data-i18n="auth.warning">⚠️ Несанкционированный доступ запрещен</p>
        </div>

        <div class="back-link">
            <a href="index.html" data-i18n="auth.back">← Вернуться на главную</a>
        </div>
    </section>
</div>

<!-- Подключаем скрипты -->
<script src="i18n.js"></script>
<script src="language-switcher.js"></script>
</body>
</html>
