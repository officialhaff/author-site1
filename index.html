<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="home.title">Terminal Portfolio</title>
    <link rel="stylesheet" href="terminal.css">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 3;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 30px 0;
        }
        .nav a {
            font-size: 1.1em;
            text-decoration: none;
            padding: 5px 10px;
            border: 2px solid var(--accent);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .nav a:hover {
            background: color-mix(in srgb, var(--accent) 25%, transparent);
            box-shadow:
                    0 0 5px var(--accent),
                    0 0 10px var(--accent),
                    0 0 15px var(--accent),
                    inset 0 0 5px rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        /* Стили для терминала */
        .terminal-container {
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 3px;
            padding: 15px;
            margin: 30px 0;
            font-family: "Fira Code", monospace;
            height: 400px;
            overflow-y: auto;
            position: relative;
            box-shadow:
                    inset 0 0 10px rgba(0, 0, 0, 0.5),
                    0 0 10px rgba(238, 195, 94, 0.2);
        }

        .terminal-header {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.85em;
            opacity: 0.7;
            text-align: center;
        }

        .terminal-content {
            color: var(--foreground);
            line-height: 1.3;
            font-size: 0.9em;
        }

        .terminal-line {
            margin: 2px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .terminal-prompt {
            color: var(--accent);
            font-weight: bold;
        }

        .terminal-command {
            color: var(--foreground);
        }

        .terminal-output {
            color: color-mix(in srgb, var(--foreground) 90%, transparent);
            margin-left: 10px;
        }

        .terminal-cursor {
            display: inline-block;
            background: var(--accent);
            width: 8px;
            height: 1.2em;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        .file-listing {
            color: color-mix(in srgb, var(--accent) 70%, transparent);
        }

        .file-permissions {
            color: color-mix(in srgb, var(--foreground) 60%, transparent);
        }

        .file-name {
            color: var(--foreground);
        }

        .dir-name {
            color: color-mix(in srgb, var(--accent) 80%, transparent);
        }

        .success-message {
            color: color-mix(in srgb, #00ff00 70%, var(--foreground));
        }

        .info-message {
            color: color-mix(in srgb, #4488ff 70%, var(--foreground));
        }

        .code-comment {
            color: color-mix(in srgb, var(--foreground) 50%, transparent);
            font-style: italic;
        }

        .code-keyword {
            color: color-mix(in srgb, var(--accent) 80%, var(--foreground));
        }

        /* Скрываем полосу прокрутки */
        .terminal-container::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .terminal-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
            opacity: 0.5;
        }

        .terminal-container::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .email-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--accent);
        }

        /* CRT-эффекты */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
            linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 2;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        .scanline {
            width: 100%;
            height: 100px;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0) 0%,
                    rgba(255, 255, 255, 0.2) 10%,
                    rgba(0, 0, 0, 0.1) 100%
            );
            opacity: 0.1;
            z-index: 1;
            pointer-events: none;
            animation: scanline 10s linear infinite;
        }

        .crt-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
            z-index: 1;
            pointer-events: none;
        }

        .crt-curvature {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            box-shadow:
                    0 0 0 10px rgba(0, 0, 0, 0.8),
                    inset 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 1;
            pointer-events: none;
        }

        @keyframes flicker {
            0% { opacity: 0.27861; }
            5% { opacity: 0.34769; }
            10% { opacity: 0.23604; }
            15% { opacity: 0.90626; }
            20% { opacity: 0.18128; }
            25% { opacity: 0.83891; }
            30% { opacity: 0.65583; }
            35% { opacity: 0.67807; }
            40% { opacity: 0.26559; }
            45% { opacity: 0.84693; }
            50% { opacity: 0.96019; }
            55% { opacity: 0.08594; }
            60% { opacity: 0.20313; }
            65% { opacity: 0.71988; }
            70% { opacity: 0.53455; }
            75% { opacity: 0.37288; }
            80% { opacity: 0.71428; }
            85% { opacity: 0.70419; }
            90% { opacity: 0.7003; }
            95% { opacity: 0.36108; }
            100% { opacity: 0.24387; }
        }

        @keyframes scanline {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(calc(100vh + 100px)); }
        }
    </style>
</head>
<body class="crt">

        </div>
        <div class="nav">

    <section class="email-section">

            </a>
            <a href="https://t.me/yourprofile" target="_blank" rel="noopener noreferrer">
                <img src="static/social/youtube.svg" alt="Youtube" width="32" height="32">
            </a>
            <a href="https://github.com/yourprofile" target="_blank" rel="noopener noreferrer">
                <img src="static/social/github.svg" alt="GitHub" width="32" height="32">

            <a href="https://instagram.com/yourprofile" target="_blank" rel="noopener noreferrer">
                <img src="static/social/twitter.svg" alt="Twitter" width="32" height="32">

        </div>
        <p class="crt-text"><span data-i18n="email">Электронная почта:</span>
            <a href="mailto:hopereborn@gmail.com">hopereborn@gmail.com</a>
        </p>

</div>

</body>
